# The TWS API .proto files are not public in a fetchable form, so CI can only
# check formatting and that the build script itself is valid. Tests that need
# the generated code run locally with -Dproto-dir.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.1
        run: |
          curl -sSfL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz | tar xJ
          echo "$PWD/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src

      - name: Check that the build script compiles
        run: zig build --help > /dev/null
