name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.1
        run: |
          curl -sSfL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz | tar xJ
          echo "$PWD/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"

      # src/proto is generated by protoc-gen-zig and kept as generated.
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src examples tests --exclude src/proto

      - name: Run tests
        run: zig build test --summary all
